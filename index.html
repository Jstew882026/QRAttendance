<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Classroom Attendance</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f4f4f9; color: #333; }
        .card { background: white; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 450px; width: 90%; }
        h1, h2 { color: #007bff; margin-top: 0; }
        #qr-image { border: 4px solid #333; padding: 10px; margin: 15px 0; background: white; max-width: 230px; width: 100%; }
        .notice { font-size: 13px; color: #666; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="card">
        <div id="display-area">Preparing attendance stream...</div>
    </div>

    <script>
        // ==========================================
        // 1. PASTE YOUR MICROSOFT FORM LINK BELOW
        // ==========================================
        const FORMS_URL = "https://forms.cloud.microsoft/r/2nH0ieTjtt"; 
        
        // 2. SET THE EXPIRATION TIME WINDOW (IN SECONDS)
        const EXPIRE_SECONDS = 20;
        // ==========================================

        const urlParams = new URLSearchParams(window.location.search);
        const isTeacherStream = urlParams.get('stream');
        const studentToken = parseInt(urlParams.get('t'));

        // --- TEACHER DISPLAY MODE ---
        if (isTeacherStream === "true") {
            function generateLiveCode() {
                const liveTimestamp = Date.now();
                // Build a URL pointing back to this exact page but with a time security stamp attached
                const studentUrl = window.location.origin + window.location.pathname + "?t=" + liveTimestamp;
                const qrApiUrl = "https://qrserver.com" + encodeURIComponent(studentUrl);
                
                document.getElementById("display-area").innerHTML = `
                    <h2>📢 Secure Attendance Stream</h2>
                    <p>Scan the code below to check in. This code changes every 20 seconds to prevent cheating.</p>
                    <img id='qr-image' src='${qrApiUrl}' alt='Classroom QR Code'>
                    <p class='notice'><strong>Anti-Cheating Rules:</strong> Do not screenshot. Shared links expire instantly.</p>
                `;
            }
            generateLiveCode();
            setInterval(generateLiveCode, EXPIRE_SECONDS * 1000); // Regenerate every 20 seconds

        // --- STUDENT SCANNING MODE ---
        } else if (studentToken) {
            const timePassed = (Date.now() - studentToken) / 1000;
            
            // Check if the student scanned it within our 20-second timeframe
            if (timePassed >= 0 && timePassed <= EXPIRE_SECONDS) {
                document.getElementById("display-area").innerHTML = "<h3>Security Verified. Redirecting to Microsoft Forms...</h3>";
                window.location.href = FORMS_URL;
            } else {
                document.getElementById("display-area").innerHTML = `
                    <h1 style='color: #d32f2f;'>QR Code Expired</h1>
                    <p>This check-in code has timed out. Please look up at the classroom projector screen for the new active code.</p>
                `;
            }
        } else {
            // Basic fallback if someone just visits the bare link
            document.getElementById("display-area").innerHTML = `
                <h1 style='color: #666;'>Classroom Gateway</h1>
                <p>Please scan the active, rotating QR code displayed on the teacher's screen.</p>
            `;
        }
    </script>
</body>
</html>
